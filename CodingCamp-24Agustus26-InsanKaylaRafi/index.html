<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <div>
            <h1>Life Dashboard</h1>
            <p>Organize your day and stay focused.</p>
        </div>
    </header>

    <div class="dashboard">
        <!-- Greeting -->
        <section class="greeting-card">
            <h2 id="greeting">Good Morning!</h2>
            <p id="date">Monday, 24 August 2026</p>
            <p class="clock" id="clock">08:30:00</p>
        </section>

        <!-- Focus Timer -->
        <section class="timer-card">
            <h2>Focus Timer</h2>

            <div class="timer-display">
                25:00
            </div>

            <div class="timer-buttons">
                <button>Start</button>
                <button>Stop</button>
                <button>Reset</button>
            </div>
        </section>

        <!-- To-Do List -->
        <section>
            <h2>To-Do List</h2>

            <div class="todo-input">
                <input
                    type="text"
                    placeholder="Add a new task..."
                >
                <button>Add Task</button>
            </div>

            <ul>
                <li>
                    Learn HTML
                    <button>Done</button>
                    <button>Edit</button>
                    <button>Delete</button>
                </li>

                <li>
                    Learn JavaScript
                    <button>Done</button>
                    <button>Edit</button>
                    <button>Delete</button>
                </li>
            </ul>
        </section>

        <!-- Quick Links -->
        <section>
            <h2>Quick Links</h2>

            <div class="links-container">
                <a href="https://www.google.com" target="_blank" class="quick-link">
                    Google
                </a>

                <a href="https://www.youtube.com" target="_blank" class="quick-link">
                    YouTube
                </a>

                <a href="https://github.com" target="_blank" class="quick-link">
                    GitHub
                </a>
            </div>
        </section>
    </div>

    <script src="js/sciprt.js"></script>
</body>
</html>
