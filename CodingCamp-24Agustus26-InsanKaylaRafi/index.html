<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coding camp revou</title>
    
    <button id="themeToggle">
    Dark Mode
    </button>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <div>
            <h1>Life Dashboard</h1>
            <p>Organize your day and stay focused.</p>
        </div>
    </header>

    <div class="dashboard">
        
        <section class="greeting-card">
            <h2 id="greeting">Good Morning!</h2>
            <p id="date">Monday, 24 August 2026</p>
            <p class="clock" id="clock">08:30:00</p>
        </section>

        
        <section class="timer-card">
            <h2>Focus Timer</h2>

            <div class="timer-display" id="timerDisplay">
                25:00
            </div>

            <div class="timer-buttons">
                <button id="startTimer">Start</button>
                <button id="stopTimer">Stop</button>
                <button id="resetTimer">Reset</button>
            </div>
        </section>

        
        <section>
            <h2>To-Do List</h2>

            <div class="todo-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                >

                <button id="addTaskBtn">
                    Add Task
                </button>
            </div>

            <ul id="taskList">
            </ul>
        </section>
       


        <section>
            <h2>Quick Links</h2>

            <div class="link-input">
                <input
                    type="text"
                    id="linkNameInput"
                    placeholder="Website name"
                >

                <input
                    type="text"
                    id="linkUrlInput"
                    placeholder="https://example.com"
                >

                <button id="addLinkBtn">
                    Add Link
                </button>
            </div>

            <div id="quickLinksList" class="links-container">
            </div>
        </section>
    </div>

    <script src="js/sciprt.js"></script>
</body>
</html>
