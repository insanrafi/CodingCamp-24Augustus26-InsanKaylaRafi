<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>Life Dashboard</h1>

    <p>Organize your day and stay focused.</p>

    <!-- Greeting -->
    <section>
        <h2>Good Morning!</h2>
        <p>Monday, 24 August 2026</p>
        <p>08:30:00</p>
    </section>

    <!-- Focus Timer -->
    <section>
        <h2>Focus Timer</h2>

        <div>
            25:00
        </div>

        <button>Start</button>
        <button>Stop</button>
        <button>Reset</button>
    </section>

    <!-- To-Do List -->
    <section>
        <h2>To-Do List</h2>

        <input
            type="text"
            placeholder="Add a new task..."
        >

        <button>Add Task</button>

        <ul>
            <li>
                Learn HTML
                <button>Done</button>
                <button>Edit</button>
                <button>Delete</button>
            </li>

            <li>
                Learn JavaScript
                <button>Done</button>
                <button>Edit</button>
                <button>Delete</button>
            </li>
        </ul>
    </section>

    <!-- Quick Links -->
    <section>
        <h2>Quick Links</h2>

        <a href="https://www.google.com" target="_blank">
            Google
        </a>

        <a href="https://www.youtube.com" target="_blank">
            YouTube
        </a>

        <a href="https://github.com" target="_blank">
            GitHub
        </a>
    </section>

</body>
</html>
